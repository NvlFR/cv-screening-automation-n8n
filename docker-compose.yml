version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cv-screening-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-cv_screening}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cv-screening-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: cv-screening-n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://${N8N_HOST:-localhost}:5678/
      - DATABASE_TYPE=postgresdb
      - DATABASE_DB_POSTGRESDB_HOST=postgres
      - DATABASE_DB_POSTGRESDB_PORT=5432
      - DATABASE_DB_POSTGRESDB_DATABASE=${DB_NAME:-cv_screening}
      - DATABASE_DB_POSTGRESDB_USER=${DB_USER:-postgres}
      - DATABASE_DB_POSTGRESDB_PASSWORD=${DB_PASSWORD:-postgres}
    links:
      - postgres
      - redis
    depends_on:
      - postgres
      - redis
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  redis_data:
  n8n_data:
